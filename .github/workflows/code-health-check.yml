name: Code Health Check

on: [push]

jobs:
  code-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - './assets/_scripts/**'
      - name: Test
        if: ${{ steps.changes.outputs.src == 'true' }}
        run: yarn test
