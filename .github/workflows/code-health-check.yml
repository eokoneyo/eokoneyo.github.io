name: Code Health Check

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  quality-checks:
    name: "code quality check"
    runs-on: ubuntu-latest
    permissions:
      contents: read      # Needed to clone the repo
      code-quality: write # Needed to upload code scanning results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Install Dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        id: changes
        with:
          filters: |
            src:
              - './assets/_scripts/**'
      - name: Test
        if: ${{ steps.changes.outputs.src == 'true' }}
        run: yarn test

  # sets base and ref for tasks that depend on this workflow completing
  persist-base-ref-info:
    name: "persist base ref info"
    needs: quality-checks
    if: github.ref_name == 'source'
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write # Needed to upload artifacts for the next workflow run
      pull-requests: read # Needed to read pull request information
    env:
      BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
      CURRENT_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref  || github.ref }}
      COMMIT_URL: ${{ github.event_name == 'pull_request' && github.pull_request.url || github.head_commit.url }}
    steps:
      - name: Save base ref info
        run: |
          echo $BASE > base.txt
          echo $CURRENT_BRANCH > current-branch.txt
          echo $COMMIT_URL > commit-url.txt
          # log file results to console for debugging
          cat base.txt
          cat current-branch.txt
          cat commit-url.txt
      - name: Upload base ref info
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: original-refs
          path: |
            base.txt
            current-branch.txt
            commit-url.txt
          retention-days: 1 # This artifact is only needed for the next workflow run, so we can delete it after 1 day.
