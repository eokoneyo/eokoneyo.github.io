name: package website

run-name: Package website for deployment

on:
  workflow_run:
    workflows: ['Code Health Check']
    branches: ['source']
    types:
      - completed

jobs:
  on-code-check-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'The triggering workflow failed'

  on-code-check-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download Artifact
        uses: dawidd6/action-download-artifact@27e4ae67c24b67d3b54bc6d6a45475be1e28031b # v26
        with:
          workflow: code-health-check.yml
          name: original-refs
      - name: add REF_BASE to env
        run: |
          echo "BASE=$(cat base.txt)" >> $GITHUB_ENV
          echo "CURRENT_BRANCH=$(cat current-branch.txt)" >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ env.CURRENT_BRANCH }}
      - uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        id: changes
        with:
          base: ${{ env.BASE }}
          ref: ${{ env.CURRENT_BRANCH }}
          filters: |
            src:
              - './**'
              - '!.husky/**'
              - '!_drafts/**'
              - '!.github/workflows/actions-security-analysis.yml'
              - '!zizmor.yml'
    outputs:
      deploy-website: ${{ steps.changes.outputs.src }}

  package-and-deploy-website:
    name: 'Package website for deployment'
    needs: on-code-check-success
    if: ${{needs.on-code-check-success.outputs.deploy-website == 'true'}}
    runs-on: ubuntu-latest
    steps:
      - name: Install Rmagick dependency
        run: |
          sudo apt update \
          && sudo apt-get install libmagickwand-dev -y
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          cache: 'yarn'
          node-version-file: '.tool-versions'
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 #v1.326.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Install dependencies and build
        env:
          SPOTIFY_USERNAME: ${{ secrets.SPOTIFY_USERNAME }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{secrets.SPOTIFY_CLIENT_SECRET}}
        run: |
          yarn install --immutable
          JEKYLL_ENV=production yarn webpack && bundle exec jekyll build --destination site
      - name: Handoff
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 #v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: master
          commit_message: ${{ github.event.head_commit.message }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
