name: package website

run-name: Package website for deployment

on:
  workflow_run:
    workflows: ['Code Health Check']
    branches: ['source']
    types:
      - completed

jobs:
  on-code-check-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'The triggering workflow failed'

  on-code-check-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - './**'
              - '!.husky/**'
              - '!_drafts/**'
              - '!.github/workflows/actions-security-analysis.yml'
              - '!zizmor.yml'

    outputs:
      deploy-website: ${{ steps.changes.outputs.src }}

  package-and-deploy-website:
    name: 'Package website for deployment'
    needs: on-code-check-success
    if: ${{needs.on-code-check-success.outputs.deploy-website == 'true'}}
    runs-on: ubuntu-latest
    steps:
      - name: Install Rmagick dependency
        run: |
          sudo apt update \
          && sudo apt-get install libmagickwand-dev -y
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          cache: 'yarn'
          node-version-file: '.tool-versions'
      - uses: ruby/setup-ruby@v1.326.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Install dependencies and build
        env:
          SPOTIFY_USERNAME: ${{ secrets.SPOTIFY_USERNAME }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{secrets.SPOTIFY_CLIENT_SECRET}}
        run: |
          yarn install --immutable
          JEKYLL_ENV=production yarn webpack && bundle exec jekyll build --destination site
      - name: Handoff
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: master
          commit_message: ${{ github.event.head_commit.message }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
